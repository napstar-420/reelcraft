name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reelcraft
          POSTGRES_PASSWORD: reelcraft
          POSTGRES_DB: reelcraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reelcraft -d reelcraft"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reelcraft/shared build
      - run: pnpm typecheck
      - run: pnpm --filter @reelcraft/api typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @reelcraft/shared test
      - run: pnpm --filter @reelcraft/api test
      - run: pnpm --filter @reelcraft/api test:e2e
        env:
          TEST_DATABASE_URL: postgres://reelcraft:reelcraft@localhost:5432/reelcraft

  # Builds the self-hosted image (not pushed) so a broken Dockerfile fails CI.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: false
          build-args: REELCRAFT_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
