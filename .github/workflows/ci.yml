name: CI

# Pull requests get one run per commit; main gets a run per push. (Running on
# every branch push as well ran everything twice for each PR commit.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new commit on a PR cancels the run for the one before it. Each run on main
# gets its own group, so none is cancelled or replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Lint, formatting, typechecks and the unit/release tests run in the
  # pre-commit hook (.husky/pre-commit), not here. CI runs only what needs
  # services: the E2E suite (Postgres) and the image (Docker).
  #
  # The E2E specs run one at a time against Postgres, so they are split across
  # shards, each with its own database.
  e2e:
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reelcraft
          POSTGRES_PASSWORD: reelcraft
          POSTGRES_DB: reelcraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reelcraft -d reelcraft"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reelcraft/shared build
      - run: pnpm --filter @reelcraft/api run test:e2e --shard=${{ matrix.shard }}/2
        env:
          TEST_DATABASE_URL: postgres://reelcraft:reelcraft@localhost:5432/reelcraft

  # Builds the self-hosted image (not pushed) and smoke-tests it, so a broken
  # Dockerfile or a container that boots but can't run anything fails CI.
  # Then installs a good and a broken in-app update on it, to prove updates
  # and rollbacks work. Both architectures the release ships, each on a
  # native runner.
  image:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - id: runtime
        run: echo "version=$(cat docker/app/RUNTIME_VERSION)" >> "$GITHUB_OUTPUT"
      # REELCRAFT_VERSION is the same for every CI build: the runtime stage's
      # RUN steps (apt, s6, agent CLIs, Chrome) see it, so a per-commit value
      # would rebuild them all every time. The commit is in the revision label.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          load: true
          tags: reelcraft:ci
          build-args: |
            REELCRAFT_VERSION=ci
            REELCRAFT_REVISION=${{ github.sha }}
            REELCRAFT_RUNTIME_VERSION=${{ steps.runtime.outputs.version }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - run: docker/app/smoke-test.sh reelcraft:ci
      - run: docker/app/update-test.sh reelcraft:ci
