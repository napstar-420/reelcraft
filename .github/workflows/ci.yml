name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reelcraft
          POSTGRES_PASSWORD: reelcraft
          POSTGRES_DB: reelcraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reelcraft -d reelcraft"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reelcraft/shared build
      - run: pnpm typecheck
      - run: pnpm --filter @reelcraft/api typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @reelcraft/shared test
      - run: pnpm --filter @reelcraft/api test
      - run: pnpm test:release
      - run: pnpm --filter @reelcraft/api test:e2e
        env:
          TEST_DATABASE_URL: postgres://reelcraft:reelcraft@localhost:5432/reelcraft

  # Builds the self-hosted image (not pushed) and smoke-tests it, so a broken
  # Dockerfile or a container that boots but can't run anything fails CI.
  # Then installs a good and a broken in-app update on it, to prove updates
  # and rollbacks work. Both architectures the release ships, each on a
  # native runner.
  image:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - id: runtime
        run: echo "version=$(cat docker/app/RUNTIME_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          load: true
          tags: reelcraft:ci
          build-args: |
            REELCRAFT_VERSION=ci-${{ github.sha }}
            REELCRAFT_REVISION=${{ github.sha }}
            REELCRAFT_RUNTIME_VERSION=${{ steps.runtime.outputs.version }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - run: docker/app/smoke-test.sh reelcraft:ci
      - run: docker/app/update-test.sh reelcraft:ci
